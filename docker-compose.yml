version: '3.8'

services:
  eureka-server:
    build: ./discoverserver
    ports:
      - "8761:8761"
    networks:
      - backend

  api-gateway:
    build: ./api-gateway
    ports:
      - "8080:8080"
    depends_on:
      - eureka-server
    networks:
      - backend

  auth-service:
    build: ./authen-service
    ports:
      - "9004:9004"
    depends_on:
      - eureka-server
    networks:
      - backend

  exam-service:
    build: ./exam-service
    ports:
      - "9002:9002"
    depends_on:
      - eureka-server
      - mongodb
      - redis
      - rabbitmq
    networks:
      - backend

  question-bank-service:
    build: ./question-bank-service
    ports:
      - "9001:9001"
    depends_on:
      - eureka-server
      - mongodb
      - rabbitmq
    networks:
      - backend

  scoring-service:
    build: ./scoring-service
    ports:
      - "9003:9003"
    depends_on:
      - eureka-server
      - mongodb
      - redis
      - rabbitmq
    networks:
      - backend

  mongodb:
    image: mongo:6
    ports:
      - "27017:27017"
    networks:
      - backend

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    networks:
      - backend

  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    networks:
      - backend

networks:
  backend:
